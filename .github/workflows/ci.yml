name: CI

on:
  push:
    branches: [main]
  pull_request:            # every PR, including stacked PRs into feature branches
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"   # Mondays 08:00 IST: catches new dependency CVEs on an idle repo

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  LLM_API_KEY: ""          # CI never calls a real LLM: everything runs in rules-only mode or with a fake

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (pycodestyle, pyflakes, isort, bugbear, bandit rules, …)
        run: ruff check --output-format=github .
      - name: Mypy (strict on rules/, planner/, privacy)
        run: mypy app

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest (random order, coverage ≥ 80%)
        run: >
          pytest -p randomly --cov --cov-report=term --cov-report=xml
          --cov-fail-under=80 --junitxml=junit.xml
      - name: Coverage summary
        if: always() && matrix.python == '3.12'
        run: |
          {
            echo "### Coverage (py${{ matrix.python }})"
            coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 14

  guardrails:
    name: Guardrails & docs sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: AGENTS.md non-negotiable rules (static)
        run: python scripts/check_guardrails.py | tee guardrails.txt
      - name: Docs ↔ code contracts
        run: python scripts/check_docs_sync.py | tee docs-sync.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Guardrails"; echo '```'; cat guardrails.txt 2>/dev/null; echo '```'
            echo "### Docs sync"; echo '```'; cat docs-sync.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: End-to-end smoke (real servers)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Boot API + UI, walk the demo script (DEMO.md A1–A7)
        env:
          SMOKE_LOG_DIR: smoke-logs
        run: python scripts/smoke.py | tee smoke.txt
      - name: Summary
        if: always()
        run: |
          { echo "### Smoke test"; echo '```'; cat smoke.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: smoke-logs/
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (known CVEs in requirements)
        run: pip-audit -r requirements.txt --progress-spinner off --desc

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, guardrails, smoke, security]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v['result'] for k, v in needs.items() if v['result'] != 'success'}
          print('job results:', {k: v['result'] for k, v in needs.items()})
          sys.exit(1 if bad else 0)"
