name: Issue dependencies

# Keeps `status:blocked` / `status:ready` in sync with GitHub's native "blocked by"
# relationships (plus "## Blocked by" checklists in issue bodies as a fallback):
#   - a blocker closes      → every issue it blocks is re-checked; if all its blockers are closed → ready
#   - a blocker is reopened → the issues it blocks go back to blocked
#   - manual run / daily    → full resync of every open issue

on:
  issues:
    types: [closed, reopened, opened, edited]
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST daily resync
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: issue-dependencies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const BLOCKED = 'status:blocked', READY = 'status:ready';

            async function blockersOf(issue) {
              // Native GitHub issue dependencies first.
              try {
                const res = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                  { owner, repo, issue_number: issue.number, per_page: 100 });
                if (res.data.length) return res.data.map(b => ({ number: b.number, state: b.state }));
              } catch (e) {
                core.info(`native dependencies unavailable for #${issue.number}: ${e.status ?? e.message}`);
              }
              // Fallback: "## Blocked by" section with "- [ ] #12" lines.
              const section = (issue.body || '').split(/^## Blocked by\s*$/m)[1] || '';
              const nums = [...section.split(/^## /m)[0].matchAll(/#(\d+)/g)].map(m => Number(m[1]));
              const out = [];
              for (const n of [...new Set(nums)]) {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: n });
                out.push({ number: n, state: data.state });
              }
              return out;
            }

            async function dependentsOf(number) {
              try {
                const res = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocking',
                  { owner, repo, issue_number: number, per_page: 100 });
                return res.data.filter(i => i.state === 'open');
              } catch (e) {
                // Fallback: open issues whose body lists this number as a blocker.
                const all = await github.paginate(github.rest.issues.listForRepo,
                                                  { owner, repo, state: 'open', per_page: 100 });
                return all.filter(i => !i.pull_request &&
                  ((i.body || '').split(/^## Blocked by\s*$/m)[1] || '').includes(`#${number}`));
              }
            }

            async function sync(issueNumber) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              if (issue.state !== 'open' || issue.pull_request) return;
              const blockers = await blockersOf(issue);
              const open = blockers.filter(b => b.state === 'open').map(b => `#${b.number}`);
              const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
              const isBlocked = labels.includes(BLOCKED), isReady = labels.includes(READY);

              if (open.length && !isBlocked) {
                if (isReady) await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: READY }).catch(() => {});
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [BLOCKED] });
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber,
                  body: `⛔ Blocked again: waiting on ${open.join(', ')}.` });
                core.info(`#${issueNumber} → blocked by ${open.join(', ')}`);
              } else if (!open.length && (isBlocked || !isReady)) {
                if (isBlocked) await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: BLOCKED }).catch(() => {});
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [READY] });
                if (isBlocked) {
                  const done = blockers.map(b => `#${b.number}`).join(', ');
                  await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber,
                    body: `✅ Unblocked: all blockers are closed (${done}). This issue is ready to start.` });
                }
                core.info(`#${issueNumber} → ready`);
              } else {
                core.info(`#${issueNumber} unchanged (${open.length ? 'blocked by ' + open.join(', ') : 'ready'})`);
              }
            }

            const ev = context.eventName, action = context.payload.action;
            if (ev === 'issues' && ['closed', 'reopened'].includes(action)) {
              const n = context.payload.issue.number;
              for (const dep of await dependentsOf(n)) await sync(dep.number);
              if (action === 'reopened') await sync(n);
            } else if (ev === 'issues') {
              await sync(context.payload.issue.number);   // opened / edited: re-evaluate itself
            } else {
              const all = await github.paginate(github.rest.issues.listForRepo,
                                                { owner, repo, state: 'open', per_page: 100 });
              for (const i of all.filter(i => !i.pull_request)) await sync(i.number);
            }
